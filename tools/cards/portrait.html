<!doctype html><html><head><meta charset="utf-8"></head><body>
<script type="module">
const root = new URLSearchParams(location.search).get('root') || '';
const { initPrims, Renderer, Scene, Camera, treeBounds } = await import(root + '/js/engine/gl3d.js');
const { buildAnimon, animateAnimon } = await import(root + '/js/render/models.js');
initPrims();
const SZ = 512;
const cv = document.createElement('canvas'); cv.width = cv.height = SZ;
const R = new Renderer(cv, { alpha: true, preserve: true, antialias: true, shadowSize: 0 });
R.setSize(SZ, SZ, 1);
window.renderMon = (id, state, yaw, shiny, tilt) => {
  const S = new Scene(); S.bg = [0, 0, 0]; S.bgAlpha = 0; S.fogNear = 900; S.fogFar = 1000;
  const M = buildAnimon(id, !!shiny, { noCache: true });
  animateAnimon(M, 0.5, state || 'idle');
  M.root.rot[1] = yaw ?? 0.6;
  S.add(M.root);
  const C = new Camera(30);
  const b = treeBounds(M.root);
  const cx = (b[0] + b[3]) / 2, cy = (b[1] + b[4]) / 2, cz = (b[2] + b[5]) / 2;
  const ext = Math.max(b[4] - b[1], (b[3] - b[0]) * 0.86, 0.6);
  const d = ext * 0.5 / Math.tan(15 * Math.PI / 180) * 1.02 + (b[5] - b[2]) * 0.5;
  C.pos = [cx, cy + d * (tilt ?? 0.12), cz + d]; C.target = [cx, cy, cz];
  R.render(S, C);
  return cv.toDataURL('image/png');
};
window.ready = true;
</script></body></html>
